<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A playful browser-based Paper Toss game with wind, physics, and streak scoring."
    />
    <meta name="theme-color" content="#f4efe6" />
    <title>Paper Toss</title>
  </head>
  <body>
    <main class="game-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Office break · 02:47 PM</p>
          <h1>Paper Toss</h1>
        </div>
        <div class="topbar-actions">
          <button class="sound-button" id="toggleSound" type="button" aria-pressed="false">Sound on</button>
          <button class="reset-button" id="resetGame" type="button">New game</button>
        </div>
      </header>

      <section class="scoreboard" aria-label="Game score">
        <div class="score-card score-card--primary">
          <span>Score</span>
          <strong id="score">0</strong>
        </div>
        <div class="score-card">
          <span>Throws</span>
          <strong id="throws">0</strong>
        </div>
        <div class="score-card">
          <span>Streak</span>
          <strong id="streak">0</strong>
        </div>
        <div class="score-card">
          <span>Best</span>
          <strong id="bestScore">0</strong>
        </div>
        <div class="score-card score-card--wind">
          <span>Fan</span>
          <strong id="wind">Still</strong>
        </div>
      </section>

      <section class="game-card" aria-labelledby="gameInstructions">
        <canvas
          id="gameCanvas"
          width="960"
          height="560"
          tabindex="0"
          role="application"
          aria-keyshortcuts="ArrowLeft ArrowRight ArrowUp ArrowDown Space"
          aria-label="Paper Toss game. Flick the paper ball upward, steering left or right for the wind, then release to throw."
        ></canvas>
        <div class="status-panel">
          <div>
            <span class="status-dot" aria-hidden="true"></span>
            <p id="gameStatus" aria-live="polite">Flick the paper upward and release.</p>
          </div>
          <p class="level-label" id="levelLabel">Level 1 · Warm-up</p>
        </div>
        <div class="power-panel" aria-label="Current throw power">
          <span>Power</span>
          <div class="power-track"><span id="powerFill"></span></div>
          <strong id="powerValue">Ready</strong>
        </div>
      </section>

      <p class="instructions" id="gameInstructions">
        <strong>Touch or mouse:</strong> flick upward and steer left or right for the fan.
        <strong>Keyboard:</strong> use left/right to steer, up/down for power, then press Space.
      </p>
    </main>

    <noscript>Paper Toss needs JavaScript enabled to run.</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
